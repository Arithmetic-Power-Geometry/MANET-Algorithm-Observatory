name: Research integrity tests

on:
  push:
    paths:
      - "literature/**"
      - "benchmark/**"
      - "tests/**"
      - "pytest.ini"
      - ".github/workflows/research-integrity.yml"
  pull_request:
    paths:
      - "literature/**"
      - "benchmark/**"
      - "tests/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q
      - run: python scripts/validate_metric_admissibility.py
