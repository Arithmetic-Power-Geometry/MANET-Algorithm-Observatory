name: Evidence release audit
on:
  push:
    paths:
      - 'scripts/release_audit.py'
      - 'literature/**'
      - 'benchmark/**'
      - 'artifacts/**'
      - 'review/**'
      - '.github/workflows/evidence-release-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/release_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-checksums
          path: artifacts/EVIDENCE_CHECKSUMS.csv
